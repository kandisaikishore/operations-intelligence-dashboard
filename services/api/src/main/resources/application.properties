server.port=8080
management.endpoints.web.exposure.include=health,info
dfip.analyzer-url=${ANALYZER_URL:http://localhost:8001}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dfip}
spring.datasource.username=${POSTGRES_USER:dfip}
spring.datasource.password=${POSTGRES_PASSWORD:dfip_local_only}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
