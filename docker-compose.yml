services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dfip
      POSTGRES_USER: dfip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dfip_local_only}
    ports: ["5432:5432"]
    volumes: [dfip_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfip -d dfip"]
      interval: 5s
      timeout: 3s
      retries: 10
  analyzer:
    build: ./services/analyzer
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  api:
    build: ./services/api
    environment:
      ANALYZER_URL: http://analyzer:8001
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dfip
      POSTGRES_USER: dfip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dfip_local_only}
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      analyzer: { condition: service_healthy }
volumes:
  dfip_data: